      icon: mdi:table-furniture
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.salle_de_bain_filles
      name: Salle de bain filles
      icon: mdi:shower
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.salle_de_bain_parents
