# Dashboard chauffage — maison « Lens »
# Généré pour l'intégration Intuis Connect (11 pièces, cartes natives Home Assistant).
# À coller dans : Paramètres > Tableaux de bord > (votre dashboard) > Modifier >
#   menu ... > Éditeur YAML brut (remplace tout le contenu).
#
# Intégration main 2.0.1. Pas de carte Coûts : les capteurs _hourly_cost n'existent
# que si l'option de statistiques de coût est activée dans les options de l'intégration.
#
# Les boutons de changement de planning utilisent 'perform-action' (HA 2024.8+).
# Sur une version antérieure, remplacer 'action: perform-action' par 'action: call-service'
# et 'perform_action:' par 'service:'.
views:
- title: Pilotage
  path: pilotage
  icon: mdi:home-thermometer
  cards:
  - type: entities
    title: Maison — Lens
    show_header_toggle: false
    entities:
    - entity: select.intuis_home_active_schedule
      name: Planning actif
      icon: mdi:calendar-check
    - entity: sensor.intuis_home_current_zone
      name: Zone en cours
      icon: mdi:map-marker-radius
    - entity: sensor.intuis_home_next_zone_change
      name: Prochain changement
      icon: mdi:clock-fast
    - entity: sensor.intuis_home_therm_mode
      name: Mode thermique
      icon: mdi:thermostat-cog
    - type: divider
    - entity: sensor.intuis_home_energy_today
      name: Énergie aujourd'hui
      icon: mdi:lightning-bolt
  - type: grid
    columns: 2
    square: false
    cards:
    - type: button
      name: Absent semaine
      icon: mdi:briefcase-clock
      show_state: false
      tap_action:
        action: perform-action
        perform_action: select.select_option
        target:
          entity_id: select.intuis_home_active_schedule
        data:
          option: Absent Semaine
    - type: button
      name: À la maison — toutes pièces
      icon: mdi:home-heart
      show_state: false
      tap_action:
        action: perform-action
        perform_action: select.select_option
        target:
          entity_id: select.intuis_home_active_schedule
        data:
          option: A La Maison Toutes Pièces
    - type: button
      name: À la maison — haut
      icon: mdi:home-floor-2
      show_state: false
      tap_action:
        action: perform-action
        perform_action: select.select_option
        target:
          entity_id: select.intuis_home_active_schedule
        data:
          option: A La Maison Haut
    - type: button
      name: Pas utilisé
      icon: mdi:home-off-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: select.select_option
        target:
          entity_id: select.intuis_home_active_schedule
        data:
          option: 'Pas Utilisé '
  - type: grid
    columns: 2
    square: false
    cards:
    - type: tile
      entity: climate.chambre_damis
      name: Chambre d'amis
      icon: mdi:bed-king-outline
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.chambre_filles
      name: Chambre filles
      icon: mdi:bed-double-outline
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.chambre_parents
      name: Chambre parents
      icon: mdi:bed-queen-outline
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.couloir
      name: Couloir
      icon: mdi:door-sliding
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.cuisine
      name: Cuisine
      icon: mdi:countertop
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - auto
        - heat
        - 'off'
      - type: target-temperature
    - type: tile
      entity: climate.entree
