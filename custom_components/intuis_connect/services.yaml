switch_schedule:
  name: Switch Schedule
  description: Activate a schedule in the selected home. Names are validated against
    its current schedules.
  fields:
    home_id:
      name: Home ID
      description: Target a loaded home by its Intuis home ID. Without a target, uses
        the first loaded home (and warns if several are loaded).
      required: false
      selector:
        text: {}
    schedule_name:
      name: Schedule Name
      description: Exact schedule name in the selected home.
      required: true
      selector:
        text: {}
refresh_schedules:
  name: Refresh Schedules
  description: Fetch the current schedules for the selected home, or all homes if
    omitted.
  fields:
    home_id:
      name: Home ID
      description: Target a loaded home by its Intuis home ID. Without a target, applies
        to all loaded homes.
      required: false
      selector:
        text: {}
set_schedule_slot:
  name: Set Schedule Slot
  description: Replace a complete interval in the selected home’s active weekly schedule.
    Supply start_day and end_day, or the legacy day field for both.
  fields:
    home_id:
      name: Home ID
      description: Target a loaded home by its Intuis home ID. Without a target, uses
        the first loaded home (and warns if several are loaded).
      required: false
      selector:
        text: {}
    start_day:
      name: Start Day
      description: 'Start day: 0=Monday, 6=Sunday. Required unless day is supplied.'
      required: false
      selector: &id001
        select:
          options:
          - value: '0'
            label: Monday
          - value: '1'
            label: Tuesday
          - value: '2'
            label: Wednesday
          - value: '3'
            label: Thursday
          - value: '4'
            label: Friday
          - value: '5'
            label: Saturday
          - value: '6'
            label: Sunday
    end_day:
      name: End Day
      description: 'End day: 0=Monday, 6=Sunday. Required unless day is supplied.'
      required: false
      selector: *id001
    day:
      name: Day (Legacy)
      description: Compatibility alias supplying both days when start_day/end_day
        are omitted.
      required: false
      selector: *id001
    start_time:
      name: Start Time
      description: Start time HH:MM; seconds must be zero.
      required: true
      selector:
        time: {}
    end_time:
      name: End Time
      description: End time HH:MM. Same-day 00:00 means the following midnight.
      required: true
      selector:
        time: {}
    zone_name:
      name: Zone Name
      description: Zone name in the active schedule of the selected home.
      required: true
      selector:
        text: {}
    schedule_name:
      name: Schedule Name
      description: Optional current name; defaults to active schedule.
      required: false
      selector:
        text: {}
    schedule_id:
      name: Schedule ID
      description: Optional stable ID; must match schedule_name if both are supplied.
      required: false
      selector:
        text: {}
set_zone_temperature:
  name: Set Zone Temperature
  description: Set a room’s temperature in a schedule zone, preserving half degrees.
  fields:
    home_id:
      name: Home ID
      description: Target a loaded home by its Intuis home ID. Without a target, uses
        the first loaded home (and warns if several are loaded).
      required: false
      selector:
        text: {}
    schedule_name:
      name: Schedule Name
      description: Exact schedule name in the selected home.
      required: true
      selector:
        text: {}
    zone_name:
      name: Zone Name
      description: Zone name in that schedule.
      required: true
      selector:
        text: {}
    room_name:
      name: Room Name
      description: Room name in that zone and home.
      required: true
      selector:
        text: {}
    temperature:
      name: Temperature
      description: Temperature from 5 to 30 °C in 0.5 °C steps.
      required: true
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          mode: box
          unit_of_measurement: °C
import_energy_history:
  name: Import Energy History
  description: Import complete local days with validated coverage, or closed hours into
    separate external hourly statistics. Failures preserve history.
  fields:
    home_id:
      name: Home ID
      description: Target a loaded home by its Intuis home ID. Without a target, applies
        to all loaded homes.
      required: false
      selector:
        text: {}
    days:
      name: Days to Import
      description: Whole number of closed days to import (1–730).
      required: false
      selector:
        number:
          min: 1
          max: 730
          step: 1
          mode: box
      default: 365
    room_name:
      name: Room (Optional)
      description: Leave empty for all rooms. Without home_id, only homes containing
        this room are imported.
      required: false
      selector:
        text: {}
    granularity:
      name: Granularity
      description: daily (default, also 1day) replaces the daily sensor history; hourly
        (also 1hour) imports closed hours into the separate external hourly statistics.
      required: false
      default: daily
      selector:
        select:
          options:
            - daily
            - hourly
sync_schedule:
  name: Sync Schedule
  description: Replace a complete weekly timetable and/or away/frost temperatures
    after validation. Defaults to the active schedule.
  fields:
    home_id:
      name: Home Id
      description: Target Intuis home ID.
      required: false
      selector:
        text: {}
    schedule_id:
      name: Schedule Id
      description: Stable schedule ID.
      required: false
      selector:
        text: {}
    schedule_name:
      name: Schedule Name
      description: Current schedule name; must match ID if supplied.
      required: false
      selector:
        text: {}
    timetable:
      name: Timetable
      description: List or JSON of unique m_offset/zone_id transitions (maximum 512).
      required: false
      selector:
        object: {}
    away_temp:
      name: Away Temp
      description: Away temperature, 5–25 °C in half degrees.
      required: false
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          mode: box
    hg_temp:
      name: Hg Temp
      description: Frost temperature, 5–15 °C in half degrees.
      required: false
      selector:
        number:
          min: 5
          max: 15
          step: 0.5
          mode: box
recalculate_cost_history:
  name: Recalculate Cost History
  description: Rewrite cost statistics from confirmed hourly energy and the configured
    price for the last closed hours. Energy is never modified; a failed room keeps its
    previous costs.
  fields:
    home_id:
      name: Home ID
      description: Target a loaded home by its Intuis home ID. Without a target, applies
        to all loaded homes with cost statistics enabled.
      required: false
      selector:
        text: {}
    days:
      name: Days
      description: Whole number of days of closed hours to recalculate (1–730).
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 730
          step: 1
          mode: box
    room_name:
      name: Room (Optional)
      description: Leave empty for all rooms and the home total.
      required: false
      selector:
        text: {}
