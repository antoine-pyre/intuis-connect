name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'codex/**']

jobs:
  tests:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2024.6.4'
            python: '3.12'
            constraints: requirements/constraints-ha-2024.6.txt
          - ha: '2026.10.4'
            python: '3.14'
            constraints: requirements/constraints-ha-2026.10.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements_dev.txt
            requirements/constraints-*.txt
      - name: Install constrained dependencies
        run: python -m pip install -r requirements_dev.txt -c "${{ matrix.constraints }}"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest
      - name: Check correctness and imports
        run: python -m ruff check .
